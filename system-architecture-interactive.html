<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Architecture — AI-Driven E2E Testing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; overflow: hidden; }
  .top-bar {
    background: #fff; border-bottom: 1px solid #ddd; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .top-bar h1 { font-size: 15pt; color: #202124; }
  .orch-toggle {
    padding: 6px 18px; border-radius: 20px; border: 2px solid #ddd;
    background: #fff; font-size: 10.5pt; cursor: pointer; font-weight: 600;
    transition: all 0.2s; color: #555;
  }
  .orch-toggle:hover { border-color: #7c3aed; color: #7c3aed; }
  .orch-toggle.active { background: #f3e8fd; border-color: #7c3aed; color: #7c3aed; }

  .diagram-area {
    width: 100%; height: calc(100vh - 52px);
    overflow: hidden; position: relative; background: #f0f2f5;
  }
  #mainsvg { width: 100%; height: 100%; cursor: grab; }
  #mainsvg.panning { cursor: grabbing; }

  .view-controls {
    position: absolute; bottom: 16px; left: 16px;
    display: flex; gap: 4px; align-items: center; z-index: 20;
  }
  .view-controls button {
    width: 32px; height: 32px; border: 1px solid #ccc; background: #fff;
    border-radius: 6px; cursor: pointer; font-size: 16px; color: #444;
    display: flex; align-items: center; justify-content: center;
  }
  .view-controls button:hover { background: #eee; }
  .zoom-label { font-size: 10pt; color: #888; margin-left: 4px; min-width: 40px; }

  /* Detail panel — slide-in overlay */
  .detail-panel {
    position: fixed; right: 0; top: 52px;
    width: 400px; height: calc(100vh - 52px);
    background: #fff; border-left: 1px solid #ddd;
    box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    overflow-y: auto; padding: 24px 20px 20px 20px;
    font-size: 10.5pt; line-height: 1.6;
    transform: translateX(100%); transition: transform 0.3s ease;
    z-index: 50;
  }
  .detail-panel.open { transform: translateX(0); }
  .close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border: none; background: #f0f2f5;
    border-radius: 50%; cursor: pointer; font-size: 18px; color: #666;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: #e0e0e0; color: #333; }
  .detail-panel h2 { font-size: 14pt; margin-bottom: 2px; padding-right: 30px; }
  .detail-panel .ctype { font-size: 10pt; color: #777; margin-bottom: 12px; }
  .detail-panel h3 { font-size: 11pt; margin-top: 16px; margin-bottom: 6px; color: #202124; }
  .detail-panel p { margin-bottom: 8px; }
  .detail-panel ul { margin: 4px 0 8px 18px; }
  .detail-panel ol { margin: 4px 0 8px 18px; }
  .detail-panel li { margin-bottom: 3px; }
  .evo { border-left: 3px solid #ddd; padding: 8px 12px; margin: 6px 0; }

  /* Feedback loop diagram */
  .evo-loop { margin: 16px 0; position: relative; padding-left: 18px; border-left: 3px solid #34a853; border-radius: 0 0 0 8px; }
  .evo-loop::before {
    content: ''; position: absolute; left: -3px; top: -8px;
    width: 20px; height: 20px; border-left: 3px solid #34a853; border-top: 3px solid #34a853;
    border-radius: 8px 0 0 0;
  }
  .evo-loop::after {
    content: '↑ feeds back'; position: absolute; left: -50px; top: 50%;
    transform: rotate(-90deg) translateX(-50%); font-size: 8.5pt; color: #1e7e34;
    font-weight: 600; white-space: nowrap;
  }
  .evo-box { padding: 8px 12px; border-radius: 6px; margin: 6px 0; font-size: 10pt; line-height: 1.5; }
  .evo-box.produces { background: #e8f0fe; border: 1px solid #4285f4; }
  .evo-box.feedback { background: #fef7e0; border: 1px solid #f9ab00; }
  .evo-box.improves { background: #e6f4ea; border: 1px solid #34a853; }
  .evo-box .elabel { font-weight: 700; font-size: 9.5pt; margin-bottom: 3px; display: block; }
  .evo-box.produces .elabel { color: #174ea6; }
  .evo-box.feedback .elabel { color: #e37400; }
  .evo-box.improves .elabel { color: #1e7e34; }
  .evo-box .sig { margin: 2px 0; padding-left: 12px; text-indent: -12px; }
  .evo-box .sig::before { content: '· '; color: #999; }
  .evo-arrow { text-align: center; color: #bbb; font-size: 14px; line-height: 1; margin: 2px 0; }
  .evo-mem { display: inline-block; background: #f3e8fd; border: 1px solid #7c3aed; border-radius: 4px;
    padding: 1px 8px; font-size: 9pt; color: #7c3aed; font-weight: 600; margin-top: 4px; }
  .evo.p1 { border-color: #4285f4; }
  .evo.p2 { border-color: #f9ab00; }
  .evo.p3 { border-color: #34a853; }
  .evo .elabel { font-weight: 700; font-size: 10pt; margin-bottom: 2px; }
  .ptag { display:inline-block; padding:1px 8px; border-radius:8px; font-size:9pt; font-weight:700; }
  .ptag.p1 { background:#e8f0fe; color:#174ea6; }
  .ptag.p2 { background:#fef7e0; color:#e37400; }
  .ptag.p3 { background:#e6f4ea; color:#1e7e34; }

  .component { cursor: pointer; }
  .component:hover rect, .component:hover ellipse { filter: brightness(0.97); }
  .component.selected rect { stroke-width: 2.5 !important; }

  /* Orchestrator flow overlay */
  .orch-flow { opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  body.orch-active .orch-flow { opacity: 1; }
  body.orch-active .orch-highlight rect:first-child {
    stroke-width: 3 !important;
    filter: drop-shadow(0 0 8px rgba(124,58,237,0.35));
  }
  body.orch-active .data-flow { opacity: 0.25; transition: opacity 0.4s; }
  .data-flow { transition: opacity 0.4s; }

  /* MCP badges always visible */
  .mcp-badge { opacity: 1; }
</style>
</head>
<body>

<div class="top-bar">
  <h1>System Architecture</h1>
  <button class="orch-toggle" id="orchBtn" onclick="toggleOrch()">Orchestrator Flow</button>
</div>

<div class="diagram-area">

  <defs>

    <text x="367" y="348" font-size="8.5" fill="#7c3aed" text-anchor="middle">fail/flaw memory → revise</text>
  </g>
  <circle cx="80" cy="258" r="14" fill="#4285f4"/><text x="80" y="263" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- Scenario Generator -->
  <g class="component" data-id="generator" onclick="showDetail('generator')">

    <rect x="80" y="430" width="380" height="32" rx="8" fill="#e8f0fe" stroke="none"/>
    <rect x="80" y="454" width="380" height="8" rx="0" fill="#e8f0fe" stroke="none"/>
    <text x="270" y="452" font-size="13" font-weight="700" fill="#174ea6" text-anchor="middle">Scenario Generator</text>
    <text x="270" y="482" font-size="11" fill="#555" text-anchor="middle">select or generate test scenarios from catalog</text>
    <rect x="290" y="505" width="155" height="18" rx="9" fill="#f3e8fd" stroke="#7c3aed" stroke-width="0.8"/>

  </g>
  <circle cx="80" cy="430" r="14" fill="#4285f4"/><text x="80" y="435" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- GROUP: Execution Engine (center)             -->

  <!-- Build & Install -->

  <circle cx="590" cy="258" r="14" fill="#5f6368"/><text x="590" y="263" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  </g>
  <circle cx="590" cy="398" r="14" fill="#4285f4"/><text x="590" y="403" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- Device Controller -->

  </g>

  <circle cx="1330" cy="568" r="14" fill="#5f6368"/><text x="1330" y="573" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>

  <!-- ════════════════════════════════════════════ -->
  <!-- DATA FLOW ARROWS (dimmed when orch active)   -->
  <!-- ════════════════════════════════════════════ -->
  <g class="data-flow">
    <!-- Planner → Generator -->

<script>
const D = {
  orchestrator: {
    name: 'Orchestrator / Run Controller', type: 'Meta-component',
    desc: 'Central coordinator that drives the entire validation pipeline. Receives trigger, sequences all steps, manages data handoff between components, and produces the final report with run metrics.<br><br><b>Interaction with each group:</b><ol><li><b>Analysis</b> — Calls Planner with code changes + context → receives risk assessment → calls Generator with risks + catalog → receives ordered scenarios + build target</li><li><b>Execution</b> — Triggers Build with target → waits for install confirmation → runs Env Pre-flight (including tweaks/COF) → hands scenarios to Navigator → Navigator/Device Controller loop runs until all scenario steps complete → evidence (logs + screenshots) collected in parallel</li><li><b>Validation</b> — Feeds collected evidence + Planner\'s rules to Validator → receives per-rule verdicts → calls Report Generator → stores artifacts → attaches to PR</li></ol><b>Error handling:</b><ul><li>LLM calls (Planner, Generator, Navigator, Validator): retry with backoff, abort after 3 failures</li><li>Build failure: abort immediately, surface error to developer</li><li>Device disconnect: attempt reconnect once, retry current step</li><li>Step timeout: configurable per step type, emit partial report on abort</li></ul><b>Metrics collected per run:</b> wall time per step, LLM token usage per step, retry count, device action count, final status (pass/fail/partial/error), estimated total cost.',
    inputs: ['Trigger: /validate-pr command or CI event', 'Configuration: timeout limits, token budget, retry policy'],
    outputs: ['Final report + artifacts attached to PR', 'Run metrics (structured JSON)', 'Status: pass / fail / partial / error'],
    evolution: [
      { p:1, l:'Phase 1: Skill prompt chain', t:'Claude Code skill that calls each step sequentially. Basic error handling: retry once, abort on second failure. Metrics logged to local file.' },
      { p:2, l:'Phase 2: Structured runner', t:'State machine with defined transitions. Parallel steps where possible (e.g., env pre-flight during scenario generation). Per-step timeout and retry config. Structured metrics JSON output.' },
      { p:3, l:'Phase 3: CI job', t:'Triggered on PR creation. Cost-bounded: hard token budget + time limit. Run history persisted for reliability tracking.' }
    ]
  },
  catalog: {
    name: 'Scenario & Knowledge Catalog', type: 'Persistent Data Store',
    desc: 'Unified knowledge base for the testing system. Contains three types of data:<br><br><b>1. Test Scenarios</b> — Reusable YAML definitions with entry points, step sequences, checkpoints, and pass/fail criteria. Two flavors:<ul><li><b>Recorded</b> (via <code>/record-flow</code>): exact coordinates/selectors, replay deterministically without AI</li><li><b>Generated</b> (via AI): intent-based steps, require Flow Navigator AI to interpret</li></ul><b>2. Screen Knowledge</b> — What Snapchat screens look like: screen hierarchy, expected layout per feature, common loading states, dialog patterns, deep link mappings.<br><br><b>3. Element → Code Mappings</b> — Maps UI elements (view IDs, component names, nametags) to their underlying code paths and expected runtime signals. Enables the system to connect "what\'s on screen" to "what code is running."<br><br><b>Sources:</b> <code>/record-flow</code>, <code>/generate-tests</code>, successful validation runs, developer annotations.',
    inputs: ['New scenarios from Generator', 'Recorded flows from /record-flow', 'Screen knowledge from flow execution', 'Developer annotations'],
    outputs: ['Scenarios for Generator to select from', 'Screen knowledge + recorded flows for Navigator'],
    evolution: [
      { p:1, l:'Phase 1: Local files', t:'YAML files in ~/.claude/test-scenarios/ and memory files for screen knowledge. Small catalog (5-10 scenarios per pilot feature). Per-developer, manually reviewed.' },
      { p:2, l:'Phase 2: Shared repo', t:'Committed alongside feature code. Team-reviewed and curated. Recorded scenarios grow as teams adopt /record-flow. Screen knowledge shared across team.' },
      { p:3, l:'Phase 3: Managed catalog', t:'Stale scenarios flagged when replay failures increase. Cross-team sharing. Screen knowledge updated when flow replays detect UI changes.' }
    ]
  },
  planner: {
    name: 'Planner / Risk Analyzer', type: 'AI Service',
    desc: 'Reads code changes (modified files, new functions, changed signatures) and traces affected code paths through the codebase — call sites, dependencies, cross-feature interactions. Identifies risk areas: null handling, async boundaries, error branches, state transitions. Outputs a structured risk assessment with validation rules that drive scenario generation.',
    inputs: ['Code changes (PR diff, modified files)', 'Codebase context (call sites, dependencies)'],
    outputs: ['Ranked risk areas', 'Validation rules'],
    evolution: [
      { p:1, l:'Phase 1: Local Skills', t:'Basic diff reading + code path tracing via Claude Code. Human reviews and confirms risk assessment before proceeding.' },
      { p:2, l:'Phase 2: Calibrated', t:'Risk analysis calibrated by feedback from pilot runs: past defect locations, known fragile paths, team-annotated risk zones.' },
      { p:3, l:'Phase 3: CI-integrated', t:'Triggered asynchronously on PR creation. Leverages historical defect data for better risk ranking.' }
    ]
  },
  generator: {
    name: 'Scenario Generator', type: 'AI Service',
    desc: 'For each risk area from the Planner, selects an existing scenario from the catalog or generates a new one. Each scenario defines: entry point, step sequence, expected signals (log patterns, UI states), and pass/fail criteria. Leverages screen knowledge from the catalog to produce more accurate scenarios.',
    inputs: ['Risk assessment + validation rules', 'Scenario & Knowledge Catalog'],
    outputs: ['Ordered test scenarios', 'Build target specification'],
    evolution: [
      { p:1, l:'Phase 1: Mostly generates', t:'Catalog is small — mostly generates new scenarios from scratch. AI reasons about steps and expected signals.' },
      { p:2, l:'Phase 2: Mostly selects', t:'Catalog grows from pilot runs and recordings. Generator increasingly selects and adapts existing scenarios rather than creating from scratch.' },
      { p:3, l:'Phase 3: Primarily selection', t:'Large catalog covers most flows. Generator selects relevant scenarios, chains them, fills in PR-specific parameters. New generation only for code paths with no existing coverage.' }
    ]
  },
  navigator: {
    name: 'Flow Navigator', type: 'AI Service (heaviest AI consumer — primary optimization target)',
    desc: 'Drives the device through scenario steps. Has two modes:<br><br><b>Recorded scenarios:</b> Replays steps deterministically via Device Controller. No AI reasoning needed. Primary path as catalog grows.<br><br><b>Generated scenarios:</b> Interprets intent-based steps by reading live UI state (tree + screenshot) and deciding concrete actions. Uses screen knowledge from catalog to understand "what am I looking at."<br><br><b>Variance handling:</b> When UI doesn\'t match expectations (loading states, animations, unexpected dialogs), AI reasons about what to do.',
    inputs: ['Scenarios from Generator', 'Screen knowledge from Catalog', 'Live device state'],
    outputs: ['Device actions (tap, swipe, input)', 'Evidence capture triggers'],
    evolution: [
      { p:1, l:'Phase 1: AI-heavy', t:'Most scenarios are AI-generated — Navigator reasons about every step. Each action requires: "what\'s on screen → what should I tap → did it work?" Expensive per run.' },
      { p:2, l:'Phase 2: Mixed', t:'Teams record critical flows via /record-flow. Recorded scenarios replay deterministically — no AI needed. AI only activates for unrecorded paths and variance handling.' },
      { p:3, l:'Phase 3: Mostly deterministic', t:'Most common flows covered by recorded scenarios. AI reserved as a thin fallback for novel screens or unexpected UI changes.' }
    ]
  },
  validator: {
    name: 'Validator / Assessor', type: 'AI Service',
    desc: 'Evaluates collected evidence (logs, screenshots, timing) against validation rules from the Planner. For each rule, produces a verdict (pass/fail/inconclusive) with supporting evidence.',
    inputs: ['Structured logs + sequence matches', 'Screenshots + diff scores', 'Validation rules from Planner'],
    outputs: ['Per-rule verdicts with evidence', 'Overall assessment'],
    evolution: [
      { p:1, l:'Phase 1: AI judges all', t:'AI interprets all results. Rules are loosely defined. Human confirms verdicts for high-risk flows.' },
      { p:2, l:'Phase 2: Hybrid', t:'Many validations become deterministic: exact regex matches on logs, pixel-diff thresholds on screenshots, timing bounds. AI handles ambiguous patterns.' },
      { p:3, l:'Phase 3: Growing deterministic share', t:'Growing portion of rules handled deterministically. AI handles complex judgments: cross-feature interactions, novel failure patterns. Human review still required for high-risk verdicts.' }
    ]
  },
  build: {
    name: 'Build & Install', type: 'Deterministic Service',
    desc: 'Builds APK/IPA and installs on target device. Handles build variant selection, incremental builds, and installation verification.',
    inputs: ['Build target from Scenario Generator'], outputs: ['APK installed on device'],
    evolution: [

function renderLoop(id) {
  const L = LOOPS[id]; if (!L) return '';
  let h = '<h3>Evolution feedback loop</h3>';
  h += '<div class="evo-loop">';
  h += `<div class="evo-box produces"><span class="elabel">Produces each run</span>${L.produces}`;
  if (L.memory) h += `<br><span class="evo-mem">${L.memory}</span>`;
  h += '</div>';
  h += '<div class="evo-arrow">▼</div>';
  h += '<div class="evo-box feedback"><span class="elabel">Feedback signals</span>';
  L.signals.forEach(s => { h += `<div class="sig">${s}</div>`; });
  h += '</div>';
  h += '<div class="evo-arrow">▼</div>';
  h += `<div class="evo-box improves"><span class="elabel">Drives improvement</span>${L.improves}</div>`;
  h += '</div>';
  return h;
}

  document.getElementById('orchBtn').classList.toggle('active', orchActive);

/* ─── Detail panel ─── */
let currentId = null;
function showDetail(id) {
  const d = D[id]; if (!d) return;
  currentId = id;
  const dp = document.getElementById('dp');
  dp.classList.add('open');
  document.querySelectorAll('.component').forEach(c => c.classList.remove('selected'));
  const el = document.querySelector(`[data-id="${id}"]`); if (el) el.classList.add('selected');

  let h = `<h2>${d.name}</h2><div class="ctype">${d.type}</div><p>${d.desc}</p>`;
  if (d.inputs?.length) h += `<h3>Inputs</h3><ul>${d.inputs.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if (d.outputs?.length) h += `<h3>Outputs</h3><ul>${d.outputs.map(o=>`<li>${o}</li>`).join('')}</ul>`;
  h += renderLoop(id);
  if (d.evolution?.length) {
    h += `<h3>Evolution across phases</h3>`;
    d.evolution.forEach(e => {
      h += `<div class="evo p${e.p}"><div class="elabel"><span class="ptag p${e.p}">${e.l}</span></div>${e.t}</div>`;
    });
  }
  document.getElementById('dp-content').innerHTML = h;
}

function closePanel() {
  document.getElementById('dp').classList.remove('open');
  document.querySelectorAll('.component').forEach(c => c.classList.remove('selected'));
  currentId = null;
}

/* ─── Pan & Zoom ─── */
const svg = document.getElementById('mainsvg');
const BASE_VW = 1800, BASE_VH = 960;
let vx = 0, vy = 0, vw = BASE_VW, vh = BASE_VH;
let isPanning = false, panSX, panSY, panVX, panVY;

function updateVB() {
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  document.getElementById('zl').textContent = Math.round(BASE_VW / vw * 100) + '%';
}

svg.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.component')) return;
  isPanning = true;
  panSX = e.clientX; panSY = e.clientY; panVX = vx; panVY = vy;
  svg.classList.add('panning');
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener('pointermove', e => {
  if (!isPanning) return;
  const r = svg.getBoundingClientRect();
  vx = panVX - (e.clientX - panSX) * (vw / r.width);
  vy = panVY - (e.clientY - panSY) * (vh / r.height);
  updateVB();
});
svg.addEventListener('pointerup', e => {
  if (!isPanning) return;
  isPanning = false;
  svg.classList.remove('panning');
  svg.releasePointerCapture(e.pointerId);
});
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.08 : 0.93;
  const r = svg.getBoundingClientRect();
  const mx = ((e.clientX - r.left) / r.width) * vw + vx;
  const my = ((e.clientY - r.top) / r.height) * vh + vy;
  const nw = Math.min(5000, Math.max(500, vw * factor));
  const nh = Math.min(3000, Math.max(265, vh * factor));
  vx = mx - (mx - vx) * (nw / vw);
  vy = my - (my - vy) * (nh / vh);
  vw = nw; vh = nh;
  updateVB();
}, { passive: false });

function zoomIn() {
  const mx = vx + vw/2, my = vy + vh/2;
  const nw = Math.max(500, vw*0.85), nh = Math.max(265, vh*0.85);
  vx = mx - (mx-vx)*(nw/vw); vy = my - (my-vy)*(nh/vh);
  vw = nw; vh = nh; updateVB();
}
function zoomOut() {
  const mx = vx + vw/2, my = vy + vh/2;
  const nw = Math.min(5000, vw*1.18), nh = Math.min(3000, vh*1.18);
  vx = mx - (mx-vx)*(nw/vw); vy = my - (my-vy)*(nh/vh);
  vw = nw; vh = nh; updateVB();
}
function resetView() { vx=0; vy=0; vw=BASE_VW; vh=BASE_VH; updateVB(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
